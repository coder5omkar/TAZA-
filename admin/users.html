<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>TAZA Admin — Users</title>
  <link rel="icon" href="logo.svg" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#7c3aed" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="../templates/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="adminSidebar" data-active="users"></aside>

    <div class="main">
      <header class="topbar">
        <div>
          <h1>Users</h1>
          <p class="sub">Customers, admins and delivery partners — roles, IDs and passwords</p>
        </div>
        <div class="admin-chip"><img src="logo.svg" alt="" /><span>Hannah · Super Admin</span></div>
      </header>

      <main class="content">
        <section class="card">
          <div class="card-head">
            <div>
              <h2>All Users</h2>
              <p class="hint" id="usersCount">8 users</p>
            </div>
            <span class="hint">Click the pencil to edit a user — name, contact, address, role, status and password</span>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr><th>User ID</th><th>Name &amp; Contact</th><th>Address</th><th>Role</th><th>Status</th><th>Password</th><th>Actions</th></tr>
              </thead>
              <tbody id="usersBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="../templates/api.js"></script>
  <script src="admin.js"></script>
</body>
</html>
