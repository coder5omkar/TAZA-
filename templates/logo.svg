<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="TAZA-PHAL-SABZI.COM — Eat Fresh">
  <defs>
    <path id="tazaArc" d="M 25 120 A 95 95 0 0 1 215 120" />
    <path id="freshArc" d="M 15 120 A 105 105 0 0 0 225 120" />
  </defs>

  <!-- badge -->
  <circle cx="120" cy="120" r="118" fill="#ffffff" />
  <circle cx="120" cy="120" r="112" fill="#15121f" />
  <circle cx="120" cy="120" r="88" fill="#ffffff" />

  <!-- ring text (textLength guarantees it always fits the band) -->
  <text font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#3fbf4f">
    <textPath href="#tazaArc" startOffset="50%" text-anchor="middle" textLength="208" lengthAdjust="spacingAndGlyphs">TAZA-PHAL-SABZI.COM</textPath>
  </text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="800" fill="#f2c53d">
    <textPath href="#freshArc" startOffset="50%" text-anchor="middle" textLength="118" lengthAdjust="spacingAndGlyphs">EAT FRESH</textPath>
  </text>

  <!-- handles (kept well inside the white circle, below the ring text) -->
  <g fill="none" stroke="#456bb0" stroke-width="5" stroke-linecap="round">
    <path d="M93 130 V101 a12 12 0 0 1 24 0 V130" />
    <path d="M123 130 V101 a12 12 0 0 1 24 0 V130" />
  </g>

  <!-- vegetables (basket covers their bottoms) -->
  <g font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" text-anchor="middle">
    <text x="64" y="124" font-size="30">🥕</text>
    <text x="84" y="106" font-size="36">🥬</text>
    <text x="102" y="124" font-size="24">🌶️</text>
    <text x="118" y="98" font-size="42">🍅</text>
    <text x="138" y="128" font-size="24">🧄</text>
    <text x="152" y="106" font-size="36">🍇</text>
    <text x="172" y="118" font-size="34">🥦</text>
  </g>

  <!-- basket -->
  <path d="M72 129 L168 129 L158.5 182 Q157 190 149 190 L91 190 Q83 190 81.5 182 Z" fill="#4f6df5" />
  <g stroke="#8ea1ff" stroke-width="2.6" stroke-linecap="round" fill="none">
    <path d="M76 146 L164 146" />
    <path d="M79 162 L161 162" />
    <path d="M82 176 L158 176" />
    <g stroke-dasharray="4 8">
      <path d="M100 132 L97 186" />
      <path d="M124 132 L124 188" />
      <path d="M148 132 L151 186" />
    </g>
  </g>
  <rect x="66" y="122" width="108" height="13" rx="6.5" fill="#9a6b3f" />
  <rect x="71" y="124.5" width="98" height="3" rx="1.5" fill="#c4975f" opacity="0.85" />
</svg>
