<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyVegFruitShop — Account</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="phone">
    <div class="screen">

      <div class="statusbar">
        <span>9:41</span>
        <span class="sb-icons" aria-hidden="true">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor">
            <rect x="0" y="7" width="3" height="4" rx="1" />
            <rect x="4.5" y="5" width="3" height="6" rx="1" />
            <rect x="9" y="2.5" width="3" height="8.5" rx="1" />
            <rect x="13.5" y="0" width="3" height="11" rx="1" />
          </svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <path d="M1 3.4a10.5 10.5 0 0 1 14 0" />
            <path d="M3.4 6a7 7 0 0 1 9.2 0" />
            <path d="M5.8 8.6a3.6 3.6 0 0 1 4.4 0" />
            <circle cx="8" cy="11" r="0.9" fill="currentColor" stroke="none" />
          </svg>
          <svg width="25" height="11" viewBox="0 0 25 11">
            <rect x="0.5" y="0.5" width="21" height="10" rx="3" fill="none" stroke="currentColor" opacity="0.5" />
            <rect x="2.5" y="2.5" width="15" height="6" rx="1.5" fill="currentColor" />
            <path d="M23.5 3.8v3.4a2 2 0 0 0 0-3.4z" fill="currentColor" opacity="0.5" />
          </svg>
        </span>
      </div>

      <header class="topbar">
        <span class="icon-btn" aria-hidden="true"></span>
        <h1 data-i18n="account_title">Account</h1>
        <button class="icon-btn" aria-label="Settings" data-toast-key="toast_demo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </button>
      </header>

      <main class="content page-content">

        <!-- profile -->
        <section class="profile-card">
          <span class="pf-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="7" r="4" />
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            </svg>
          </span>
          <div class="pf-info">
            <h4 data-i18n="profile_name">Hannah</h4>
            <p>hannah@vegfruit.shop</p>
          </div>
          <button class="pf-edit" aria-label="Edit profile">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" />
            </svg>
          </button>
        </section>

        <!-- stats -->
        <section class="stats">
          <div class="stat"><b>12</b><span data-i18n="stat_orders">Orders</span></div>
          <div class="stat"><b>2</b><span data-i18n="stat_addresses">Addresses</span></div>
          <div class="stat"><b>5</b><span data-i18n="stat_favourites">Favourites</span></div>
        </section>

        <!-- menu -->
        <nav class="menu-list">
          <a class="menu-item" href="history.html">
            <span class="m-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16.5 9.4 7.5 4.21" />
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
                <path d="M3.27 6.96 12 12.01l8.73-5.05" />
                <path d="M12 22.08V12" />
              </svg>
            </span>
            <span data-i18n="menu_my_orders">My Orders</span>
            <span class="chev" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6" /></svg>
            </span>
          </a>

          <!-- language preference (compact row) -->
          <div class="menu-item">
            <span class="m-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <path d="M2 12h20" />
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
              </svg>
            </span>
            <span data-i18n="lang_label">Language</span>
            <div class="lang-mini" role="group" aria-label="Language / भाषा">
              <button class="lang" data-lang="en">EN</button>
              <button class="lang" data-lang="hi">हिं</button>
              <button class="lang" data-lang="mr">मर</button>
            </div>
          </div>

          <button class="menu-item" id="btnAddress">
            <span class="m-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                <circle cx="12" cy="10" r="3" />
              </svg>
            </span>
            <span data-i18n="menu_addresses">Delivery Addresses</span>
            <span class="chev" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6" /></svg>
            </span>
          </button>

          <button class="menu-item" id="btnPayment">
            <span class="m-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="1" y="4" width="22" height="16" rx="2" />
                <path d="M1 10h22" />
              </svg>
            </span>
            <span data-i18n="menu_payments">Payment Methods</span>
            <span class="chev" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6" /></svg>
            </span>
          </button>

          <a class="menu-item" href="messages.html">
            <span class="m-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
                <path d="M12 17h.01" />
              </svg>
            </span>
            <span data-i18n="menu_help">Help &amp; Support</span>
            <span class="chev" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6" /></svg>
            </span>
          </a>
        </nav>

        <!-- logout -->
        <nav class="menu-list">
          <a class="menu-item danger" href="login.html">
            <span class="m-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <path d="M16 17l5-5-5-5" />
                <path d="M21 12H9" />
              </svg>
            </span>
            <span data-i18n="menu_logout">Log Out</span>
          </a>
        </nav>
      </main>

      <!-- ============ Bottom navigation ============ -->
      <nav class="tabbar">
        <a class="tab-item" href="index.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <path d="M9 22V12h6v10" />
          </svg>
          <span data-i18n="tab_home">Home</span>
        </a>

        <a class="tab-item" href="history.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7v5l3 2" />
          </svg>
          <span data-i18n="tab_history">History</span>
        </a>

        <a class="tab-fab" href="cart.html" aria-label="Cart — shop bag">
          <img src="bag.svg" alt="" width="36" height="36" />
        </a>

        <a class="tab-item" href="messages.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z" />
          </svg>
          <span data-i18n="tab_message">Message</span>
        </a>

        <a class="tab-item active" href="account.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="7" r="4" />
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          </svg>
          <span data-i18n="tab_account">Account</span>
        </a>
      </nav>

      <!-- ============ account sheets (profile / address / payment) ============ -->
      <div class="sheet-backdrop" id="acctBackdrop" hidden></div>

      <!-- edit profile: name + email -->
      <section class="order-sheet" id="sheetProfile" hidden aria-label="Edit profile">
        <div class="sheet-head">
          <div><h3 data-i18n="edit_profile">Edit profile</h3></div>
          <button class="icon-btn acct-sheet-close" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12" /></svg>
          </button>
        </div>
        <div class="acct-form">
          <label class="acct-field"><span data-i18n="field_name">Name</span><input id="pfName" type="text" autocomplete="name" /></label>
          <label class="acct-field"><span data-i18n="field_email">Email</span><input id="pfEmail" type="email" autocomplete="email" /></label>
        </div>
        <p class="sheet-hint" data-i18n="email_note">Email verification will be added soon</p>
        <button class="btn-primary sheet-save" id="pfSave" data-i18n="save_btn">Save</button>
      </section>

      <!-- delivery address: flat / floor / building / area / city / pin -->
      <section class="order-sheet" id="sheetAddress" hidden aria-label="Delivery address">
        <div class="sheet-head">
          <div><h3 data-i18n="menu_addresses">Delivery Addresses</h3></div>
          <button class="icon-btn acct-sheet-close" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12" /></svg>
          </button>
        </div>
        <p class="sheet-hint"><span data-i18n="current_address">Current address</span>: <b id="curAddress">—</b></p>
        <div class="acct-grid">
          <label class="acct-field"><span data-i18n="addr_flat">Flat / House No</span><input id="adFlat" type="text" /></label>
          <label class="acct-field"><span data-i18n="addr_floor">Floor</span><input id="adFloor" type="text" /></label>
          <label class="acct-field"><span data-i18n="addr_building">Building / Apartment</span><input id="adBuilding" type="text" /></label>
          <label class="acct-field"><span data-i18n="addr_area">Area / Locality</span><input id="adArea" type="text" /></label>
          <label class="acct-field"><span data-i18n="addr_city">City</span><input id="adCity" type="text" /></label>
          <label class="acct-field"><span data-i18n="addr_pin">PIN code</span><input id="adPin" type="text" inputmode="numeric" maxlength="6" /></label>
        </div>
        <button class="btn-primary sheet-save" id="adSave" data-i18n="save_btn">Save</button>
      </section>

      <!-- default payment method (UPI 3% off) -->
      <section class="order-sheet" id="sheetPayment" hidden aria-label="Payment methods">
        <div class="sheet-head">
          <div><h3 data-i18n="pay_default_title">Payment Methods</h3></div>
          <button class="icon-btn acct-sheet-close" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12" /></svg>
          </button>
        </div>
        <div class="pay-options">
          <label class="addr-option" id="payUpi" data-pay="upi">
            <input type="radio" name="default-pay" hidden />
            <span class="addr-radio" aria-hidden="true"></span>
            <span class="addr-body">
              <span class="addr-type">UPI <em class="pay-tag" data-i18n="pay_upi_tag">3% discount</em></span>
              <span class="addr-text" data-i18n="pay_upi_at_door">Scan &amp; pay when your order arrives</span>
            </span>
          </label>
          <label class="addr-option active" id="payCod" data-pay="cod">
            <input type="radio" name="default-pay" checked hidden />
            <span class="addr-radio" aria-hidden="true"></span>
            <span class="addr-body">
              <span class="addr-type" data-i18n="pay_cod">Cash on Delivery</span>
              <span class="addr-text" data-i18n="pay_cod_sub">Pay when your order arrives</span>
            </span>
          </label>
        </div>
        <button class="btn-primary sheet-save" id="paySave" data-i18n="save_btn">Save</button>
      </section>

    </div>
  </div>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
